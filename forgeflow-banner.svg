  <text x="159" y="86" text-anchor="middle" fill="#55e7c0" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">AGENT ORCHESTRATION</text>
  <text x="64" y="175" fill="#f3f8ff" font-family="Arial,sans-serif" font-size="65" font-weight="bold">ForgeFlow CLI</text>
  <text x="67" y="225" fill="#bacbe0" font-family="Arial,sans-serif" font-size="23">One project prompt. Coordinated execution.</text>
  <text x="67" y="280" fill="#76dcca" font-family="Arial,sans-serif" font-size="17">PLAN  /  EXECUTE  /  CHECKPOINT  /  RESUME</text>
  <text x="67" y="339" fill="#8ca5c2" font-family="Arial,sans-serif" font-size="16">Windows · macOS · Linux     |     Node.js 20+</text>
