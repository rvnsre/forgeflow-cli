<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ForgeFlow CLI</title>
  <desc id="desc">Plan, coordinate, execute, and resume coding workflows across up to 256 agent slots.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142742"/></linearGradient><linearGradient id="accent"><stop stop-color="#55e7c0"/><stop offset="1" stop-color="#6b9eff"/></linearGradient></defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#34516e" stroke-width="2"><path d="M920 100v200M820 200h200M849 129l142 142M849 271l142-142"/><circle cx="920" cy="200" r="100"/></g>
  <g fill="#55e7c0"><circle cx="920" cy="100" r="9"/><circle cx="1020" cy="200" r="9"/><circle cx="920" cy="300" r="9"/><circle cx="820" cy="200" r="9"/></g>
  <circle cx="920" cy="200" r="49" fill="#142742" stroke="url(#accent)" stroke-width="3"/>
