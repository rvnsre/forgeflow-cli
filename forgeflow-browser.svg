<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc"><title id="title">Read the page with less payload.</title><desc id="desc">Semantic inspection comes first; optional screenshots stay in local artifacts.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091220"/><stop offset="1" stop-color="#142740"/></linearGradient><linearGradient id="a"><stop stop-color="#6ee7c4"/><stop offset="1" stop-color="#73a9ff"/></linearGradient></defs><rect width="1440" height="680" rx="24" fill="url(#bg)"/><path d="M56 56h52" stroke="#6ee7c4" stroke-width="4"/><text x="126" y="62" fill="#7de4cb" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">03 / BROWSER AUTOMATION</text><text x="56" y="135" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Read the page with less payload.</text><text x="58" y="178" fill="#a4b8d3" font-family="Arial,sans-serif" font-size="20">Semantic inspection comes first; optional screenshots stay in local artifacts.</text><rect x="56" y="245" width="402" height="284" rx="16" fill="#11243a" stroke="#34516c"/><text x="78" y="280" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">BROWSER SESSION</text><text x="78" y="318" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Isolated Chromium</text><text x="78" y="353" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">A separate context per worker.</text><text x="80" y="401" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">HTTP / HTTPS navigation</text><text x="80" y="443" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Visible controls and fields</text><text x="80" y="485" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Localhost for development</text><rect x="512" y="245" width="402" height="284" rx="16" fill="#11243a" stroke="#34516c"/><text x="534" y="280" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">MODEL CONTEXT</text><text x="534" y="318" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Semantic snapshot</text><text x="534" y="353" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">Compact references for actions.</text><text x="536" y="401" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Headings, links, and buttons</text><text x="536" y="443" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Click · Fill · Press</text><text x="536" y="485" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Snapshot before interaction</text><rect x="968" y="245" width="416" height="284" rx="16" fill="#11243a" stroke="#34516c"/><text x="990" y="280" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">OPTIONAL CAPTURE</text><text x="990" y="318" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Local screenshot</text><text x="990" y="353" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">JPEG saved as an artifact.</text><text x="992" y="401" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Returns a local file path</text><text x="992" y="443" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">No base64 image payload</text><text x="992" y="485" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="19" font-weight="400">Not model vision input</text><path d="M56 612h1328" stroke="#29405b"/><text x="56" y="647" fill="#7e96b2" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">FORGEFLOW CLI</text><text x="1384" y="647" text-anchor="end" fill="#7e96b2" font-family="Arial,sans-serif" font-size="14">Architecture illustration · Not a benchmark</text></svg