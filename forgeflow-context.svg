<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc"><title id="title">Keep the useful context in view.</title><desc id="desc">Four controls limit context growth across a long coding workflow.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091220"/><stop offset="1" stop-color="#142740"/></linearGradient><linearGradient id="a"><stop stop-color="#6ee7c4"/><stop offset="1" stop-color="#73a9ff"/></linearGradient></defs><rect width="1440" height="680" rx="24" fill="url(#bg)"/><path d="M56 56h52" stroke="#6ee7c4" stroke-width="4"/><text x="126" y="62" fill="#7de4cb" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">04 / CONTEXT CONTROL</text><text x="56" y="135" fill="#f0f6ff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Keep the useful context in view.</text><text x="58" y="178" fill="#a4b8d3" font-family="Arial,sans-serif" font-size="20">Four controls limit context growth across a long coding workflow.</text><rect x="56" y="255" width="314" height="190" rx="16" fill="#11243a" stroke="#34516c"/><text x="78" y="290" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">CONTROL 01</text><text x="78" y="328" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Focused reads</text><text x="78" y="363" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">Search and line ranges</text><rect x="394" y="255" width="314" height="190" rx="16" fill="#11243a" stroke="#34516c"/><text x="416" y="290" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">CONTROL 02</text><text x="416" y="328" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Bounded output</text><text x="416" y="363" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">Trim large tool responses</text><rect x="732" y="255" width="314" height="190" rx="16" fill="#11243a" stroke="#34516c"/><text x="754" y="290" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">CONTROL 03</text><text x="754" y="328" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Recent context</text><text x="754" y="363" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">Keep complete tool groups</text><rect x="1070" y="255" width="314" height="190" rx="16" fill="#11243a" stroke="#34516c"/><text x="1092" y="290" fill="#70dfc5" font-family="Arial,sans-serif" font-size="14" font-weight="400">CONTROL 04</text><text x="1092" y="328" fill="#f1f7ff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Usage limits</text><text x="1092" y="363" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="16" font-weight="400">Cap tokens and API calls</text><text x="58" y="504" fill="#e5efff" font-family="Arial,sans-serif" font-size="23" font-weight="400">Measured by provider usage when available; estimated otherwise.</text><text x="58" y="548" fill="#c4d4e9" font-family="Arial,sans-serif" font-size="18" font-weight="400">Character-based estimates are not exact token counts or a currency budget.</text><path d="M56 612h1328" stroke="#29405b"/><text x="56" y="647" fill="#7e96b2" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">FORGEFLOW CLI</text><text x="1384" y="647" text-anchor="end" fill="#7e96b2" font-family="Arial,sans-serif" font-size="14">Architecture illustration · Not a benchmark</text></svg>